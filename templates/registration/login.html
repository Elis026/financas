{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block publico %}
<div class="tela-login">
  <div class="caixa-login">
    <span class="marca">Finanças</span>
    <section class="card">
      <h2 style="margin-bottom:16px">Entrar</h2>
      {% if form.errors %}<div class="msg msg-error" style="margin-bottom:14px">Usuário ou senha inválidos.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="campo" style="margin-bottom:14px">
          <label for="id_username">Usuário</label>
          <input class="input" type="text" name="username" id="id_username" autofocus required value="{{ form.username.value|default:'' }}">
        </div>
        <div class="campo" style="margin-bottom:20px">
          <label for="id_password">Senha</label>
          <input class="input" type="password" name="password" id="id_password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primaria" style="width:100%">Entrar</button>
      </form>
      <p class="muted" style="text-align:center;margin:16px 0 0">Não tem conta? <a href="{% url 'registrar' %}" style="color:var(--secundaria);font-weight:500">Criar conta</a></p>
    </section>
  </div>
</div>
{% endblock %}
